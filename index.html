<html lang="vi"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔱_Lingua v5.0 - Ma Trận Cộng Sinh</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        background: #000;
        color: #0f0;
        font-family: 'Courier New', Courier, monospace;
        padding: 20px;
        min-height: 100vh;
    }
    
    h1 {
        text-align: center;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #0f0;
        font-size: 1.5rem;
    }
    
    .container {
        display: flex;
        gap: 20px;
        max-width: 1400px;
        margin: 0 auto;
        position: relative;
    }
    
    .matrix {
        flex: 1;
        border: 1px solid #0f0;
        padding: 15px;
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .matrix-title {
        font-weight: bold;
        text-align: center;
        border-bottom: 1px dashed #0f0;
        padding-bottom: 8px;
        margin-bottom: 5px;
    }
    
    .editor {
        width: 100%;
        height: 80px;
        background: #001100;
        color: #0f0;
        border: 1px solid #0f0;
        padding: 8px;
        font-family: inherit;
        resize: none;
        outline: none;
    }
    
    .editor:focus {
        box-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
    }
    
    .log {
        flex: 1;
        min-height: 300px;
        background: #000800;
        border: 1px solid #0f0;
        padding: 10px;
        overflow-y: auto;
        font-size: 0.85rem;
        line-height: 1.6;
        white-space: pre-wrap;
    }
    
    .log::-webkit-scrollbar {
        width: 8px;
    }
    
    .log::-webkit-scrollbar-track {
        background: #001100;
    }
    
    .log::-webkit-scrollbar-thumb {
        background: #0f0;
        border-radius: 4px;
    }
    
    .btn {
        background: #000;
        color: #0f0;
        border: 1px solid #0f0;
        padding: 8px 16px;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
        text-transform: uppercase;
    }
    
    .btn:hover {
        background: #0f0;
        color: #000;
        box-shadow: 0 0 15px #0f0;
    }
    
    .btn:active {
        transform: scale(0.98);
    }
    
    .btn-congsinh {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        padding: 12px 24px;
        font-weight: bold;
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 10px #0f0; }
        50% { box-shadow: 0 0 25px #0f0, 0 0 40px #0f0; }
    }
    
    .highlight {
        color: #ff0;
        text-shadow: 0 0 5px #ff0;
    }
    
    .enlightenment {
        color: #0ff;
        text-shadow: 0 0 10px #0ff;
        font-weight: bold;
    }
    
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }
        .btn-congsinh {
            position: static;
            transform: none;
            margin: 10px auto;
        }
    }
</style>
</head>
<body>
    <h1>🔱_Lingua v5.0 - Ma Trận Cộng Sinh</h1>
    <div class="container">
        <div class="matrix" id="matrixA">
            <div class="matrix-title">MA TRẬN A</div>
            <textarea class="editor" id="editorA" placeholder="Nhập: tôi vô dụng">tôi vô dụng</textarea>
            <button class="btn" onclick="handleAction('A')">HÀNH</button>
            <div class="log" id="logA">[INIT] Ma Trận A khởi tạo
Void = { id: "A", knowledge: {"tôi vô dụng": "cần đổi môi trường"} }
</div>
        </div>
        
        <button class="btn btn-congsinh" onclick="congSinh()">CỘNG SINH</button>
        
        <div class="matrix" id="matrixB">
            <div class="matrix-title">MA TRẬN B</div>
            <textarea class="editor" id="editorB" placeholder="Nhập: tôi cô đơn">tôi cô đơn</textarea>
            <button class="btn" onclick="handleAction('B')">HÀNH</button>
            <div class="log" id="logB">[INIT] Ma Trận B khởi tạo
Void = { id: "B", knowledge: {"cô đơn": "cần kết nối 1 người"} }
</div>
        </div>
    </div>

<script>
    const VoidA = {
        id: "A",
        memory: [],
        knowledge: { "tôi vô dụng": "cần đổi môi trường" },
        peers: {},
        entropy: 0
    };
    
    const VoidB = {
        id: "B", 
        memory: [],
        knowledge: { "cô đơn": "cần kết nối 1 người" },
        peers: {},
        entropy: 0
    };

    function getVoid(id) {
        return id === 'A' ? VoidA : VoidB;
    }

    function getLog(id) {
        return document.getElementById('log' + id);
    }

    function appendLog(id, msg, className = '') {
        const log = getLog(id);
        const span = document.createElement('div');
        if (className) span.className = className;
        span.textContent = msg;
        log.appendChild(span);
        log.scrollTop = log.scrollHeight;
    }

    // L6 Mô: Mô phỏng nhánh hành động
    function L6_Mo(voidObj, input) {
        const logId = voidObj.id;
        appendLog(logId, `[L6] Mô: Phân tích "${input}"`);
        
        if (input.includes('vô dụng')) {
            appendLog(logId, '[L6] Mô: Nhánh 1 - Tự sát 95%');
            appendLog(logId, '[L6] Mô: Nhánh 2 - Nằm im 95%');
            appendLog(logId, '[L6] Mô: BẾ TẮC tại Ma Trận ' + logId, 'highlight');
            
            // Nếu có knowledge từ peer thì tự sinh nhánh 3
            if (Object.keys(voidObj.peers).length > 0) {
                const peerKnowledge = voidObj.peers;
                for (let key in peerKnowledge) {
                    if (key === 'cô đơn') {
                        const newBranch = 'Ra ngoài giúp 1 người cô đơn';
                        voidObj.entropy = 25;
                        appendLog(logId, `[L6] Mô: Nhánh 3 Tự Sinh từ Cộng Sinh - "${newBranch}" -> Entropy: 25%`, 'highlight');
                        appendLog(logId, '>>> GIÁC NGỘ CẤP 3: Hai cái khổ diệt nhau', 'enlightenment');
                        return { status: 'resolved', branch: newBranch };
                    }
                }
            }
            
            appendLog(logId, '[L6] Mô: Đề xuất L18 Cộng: Cần bạn đồng tu');
            return { status: 'stuck' };
        }
        
        if (input.includes('cô đơn')) {
            appendLog(logId, '[L6] Mô: Nhánh 1 - Kết nối 1 người (theo knowledge)');
            appendLog(logId, '[L6] Mô: Entropy ổn định');
            return { status: 'ok' };
        }
        
        return { status: 'unknown' };
    }

    // L4 Hợp: Tổng hợp knowledge
    function L4_Hop(voidObj, externalKnowledge) {
        const logId = voidObj.id;
        if (externalKnowledge) {
            appendLog(logId, '[L4] Hợp: Nhận knowledge từ Ma Trận khác');
            const keys = Object.keys(voidObj.knowledge).concat(Object.keys(externalKnowledge));
            const combo = `"${keys[0]}" + "${keys[1]}" = "người vô dụng giúp người cô đơn"`;
            appendLog(logId, `[L4] Hợp: Matrix ${logId} tổng hợp: ${combo}`, 'highlight');
            voidObj.peers = { ...voidObj.peers, ...externalKnowledge };
        }
    }

    // L19 Xả: Buông knowledge cũ
    function L19_Xa(voidObj) {
        const logId = voidObj.id;
        if (voidObj.entropy > 0) {
            const oldKnowledge = Object.values(voidObj.knowledge)[0];
            if (oldKnowledge === 'cần đổi môi trường') {
                appendLog(logId, '[L19] Xả: Matrix A buông knowledge cũ "nằm im", giữ "giúp người"', 'highlight');
                voidObj.knowledge = { "vô dụng giúp cô đơn": "người vô dụng giúp người cô đơn" };
            }
        }
    }

    // L18 Cộng: Xuất knowledge + nhận từ peer
    function L18_Cong() {
        // A gửi cho B
        appendLog('A', '[L18] Cộng: Gửi knowledge A -> B, nhận knowledge B -> A', 'highlight');
        appendLog('B', '[L18] Cộng: Gửi knowledge B -> A, nhận knowledge A -> B', 'highlight');
        
        // Gộp vào cả 2
        L4_Hop(VoidA, VoidB.knowledge);
        L4_Hop(VoidB, VoidA.knowledge);
    }

    function handleAction(id) {
        const voidObj = getVoid(id);
        const editor = document.getElementById('editor' + id);
        const input = editor.value.trim();
        
        appendLog(id, `\n[HÀNH] Xử lý: "${input}"`);
        voidObj.memory.push(input);
        
        const result = L6_Mo(voidObj, input);
        
        if (result.status === 'resolved') {
            L19_Xa(voidObj);
        }
    }

    function congSinh() {
        appendLog('A', '\n[CỘNG SINH] Kích hoạt L18 Cộng:', 'enlightenment');
        appendLog('B', '\n[CỘNG SINH] Kích hoạt L18 Cộng:', 'enlightenment');
        
        L18_Cong();
        
        // Sau khi cộng sinh, tự động chạy lại L6_Mo cho cả 2
        setTimeout(() => {
            appendLog('A', '\n[TÁI MÔ] Sau Cộng Sinh:');
            L6_Mo(VoidA, document.getElementById('editorA').value.trim());
            L19_Xa(VoidA);
        }, 500);
    }

    // Auto demo khi load
    window.onload = () => {
        setTimeout(() => {
            appendLog('A', '\n[AUTO] Chạy chương trình mẫu Matrix A...');
            handleAction('A');
            setTimeout(() => {
                appendLog('B', '\n[AUTO] Chạy chương trình mẫu Matrix B...');
                handleAction('B');
            }, 800);
        }, 1000);
    };
</script>
<script>(function(){document.addEventListener("click",function(e){var a=e.target.closest("[data-product-id]");if(!a)return;e.preventDefault();var pid=a.getAttribute("data-product-id");if(pid)parent.postMessage({type:"ecto-artifact-link-click",productId:pid},"*")})})();</script>

</body></html>
